<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Clearance Desk</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1>Vendor Clearance Desk</h1>
  <div id="badges"></div>
</header>
<div id="demo-banner" class="banner" hidden></div>

<section id="login" class="card" hidden>
  <h2>Sign in</h2>
  <form id="login-form">
    <label for="pw">Access password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</section>

<main id="main" hidden>
  <section class="card">
    <h2>New request</h2>
    <form id="run-form">
      <label for="text">Describe the vendor in plain English</label>
      <textarea id="text" rows="3" maxlength="2000" required
        placeholder="Check Acme Logistics Pvt Ltd, website acmelogistics.in, director Rahul Mehta, high risk."></textarea>
      <div class="controls">
        <label>Strictness <select id="strictness"></select></label>
        <label>Evidence to reject <select id="rejection_evidence"></select></label>
        <label>Data freshness (days) <select id="freshness_days"></select></label>
      </div>
      <p id="control-notes" class="note"></p>
      <button type="submit" id="run-btn">Run</button>
      <span id="running" class="note" hidden>Running checks…</span>
    </form>
  </section>

  <section id="result" class="card" hidden aria-live="polite"></section>

  <section class="card">
    <h2>Past runs</h2>
    <table id="runs"><thead><tr><th>Started (UTC)</th><th>Vendor</th><th>Result</th><th>Approval</th><th>Credits</th></tr></thead><tbody></tbody></table>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
